[env]
FFMPEG_DIR = "/opt/ffmpeg-7.1"
PKG_CONFIG_PATH = "/opt/ffmpeg-7.1/lib/pkgconfig"

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-L", "/opt/ffmpeg-7.1/lib",
    "-C", "link-arg=-Wl,--no-as-needed",
    "-C", "link-arg=-lavformat",
    "-C", "link-arg=-lavcodec",
    "-C", "link-arg=-lavutil",
    "-C", "link-arg=-lswscale",
    "-C", "link-arg=-lavfilter",
    "-C", "link-arg=-lavdevice",
    "-C", "link-arg=-lswresample",
    "-C", "link-arg=-lm",
    "-C", "link-arg=-lpthread",
    "-C", "link-arg=-lz",
    "-C", "link-arg=-lbz2",
    "-C", "link-arg=-llzma",
]
